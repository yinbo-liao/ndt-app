name: flutter_mcp_server
description: Hardened MCP server for Flutter project operations with sandboxing,
  rate limiting, circuit breakers, and audit logging.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.12.0

dependencies:
  crypto: ^3.0.6
  path: ^1.9.1
  logging: ^1.3.0
  synchronized: ^3.3.1
  stream_channel: ^2.1.4
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_web_socket: ^2.0.1
  web_socket_channel: ^3.0.2
  collection: ^1.19.1

dev_dependencies:
  test: ^1.25.15
  lints: ^5.1.1
