name: ndt_app
description: "NDT Management Mobile App - Non-Destructive Testing Operations Management"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.8.0

  # State Management
  flutter_riverpod: ^2.6.0

  # Navigation
  go_router: ^14.0.0

  # Charts
  fl_chart: ^0.68.0

  # UI Utilities
  intl: ^0.19.0
  flutter_slidable: ^3.1.0
  shimmer: ^3.0.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Models & Equality
  equatable: ^2.0.5

  # Utilities
  uuid: ^4.5.0

  # PDF Export
  pdf: ^3.11.0
  printing: ^5.13.0

  # Notifications
  flutter_local_notifications: ^18.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
